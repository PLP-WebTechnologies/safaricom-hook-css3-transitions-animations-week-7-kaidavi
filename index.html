<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Web Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="banner">Welcome to the Interactive Page</header>

  <main>
    <button class="interactive-btn">Hover Me</button>
    <div class="card">Hover Over Me</div>

    <button class="trigger-animation-btn">Trigger Spinner</button>
    <div class="spinner hidden"></div>

    <div class="modal hidden">
      <p>This is a modal!</p>
      <button class="toggle-modal-btn">Close Modal</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
